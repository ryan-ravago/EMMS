# EMMS on Docker: the parts both environments share.
#
# Do not run this file alone. Combine it with one environment file:
#
#   Testing     docker compose --env-file docker/env/testing.env -f compose.yaml -f compose.testing.yaml up -d --build
#   Production  docker compose --env-file docker/env/production.env -f compose.yaml -f compose.production.yaml up -d --build
#
# Services
#   web        Caddy: HTTPS (port 80 redirects to it), static files, passes PHP to app
#   app        PHP 8.3 FPM with OPcache
#   queue      queue worker (background jobs: RFID processing, mail)
#   scheduler  runs the scheduled tasks (RFID checks, log clean-up, syncs)
#   migrate    applies database migrations, then exits; the others wait for it
#
# Hardening applied to every container: no extra privileges, all Linux capabilities dropped, read-only root
# filesystem (only the storage volume and small temp folders are writable), log rotation.

name: emms

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-app-build: &app-build
  context: .
  target: app
  args:
    PHP_VERSION: ${PHP_VERSION:-8.3.36}

# What the PHP containers may write to: temp files, the per-container Laravel cache (rebuilt at start), storage.
x-php-writable: &php-writable
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=128m,uid=82,gid=82
    - /var/www/html/bootstrap/cache:rw,noexec,nosuid,size=16m,uid=82,gid=82

services:
  app:
    <<: [*hardening, *php-writable]
    build: *app-build
    image: emms-app:${IMAGE_TAG:-latest}
    volumes:
      - storage:/var/www/html/storage
    secrets:
      - source: google_sheets_credentials
        target: /var/www/html/storage/google-sheets-credentials.json
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - backend

  queue:
    <<: [*hardening, *php-writable]
    image: emms-app:${IMAGE_TAG:-latest}
    pull_policy: never
    # Stops after an hour or 1000 jobs and is restarted by Docker, so a memory leak can never build up.
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=120", "--max-time=3600", "--max-jobs=1000"]
    stop_grace_period: 130s
    volumes:
      - storage:/var/www/html/storage
    secrets:
      - source: google_sheets_credentials
        target: /var/www/html/storage/google-sheets-credentials.json
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'artisan queue:work' > /dev/null"]
      interval: 60s
      timeout: 5s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - backend

  scheduler:
    <<: [*hardening, *php-writable]
    image: emms-app:${IMAGE_TAG:-latest}
    pull_policy: never
    command: ["php", "artisan", "schedule:work"]
    stop_grace_period: 30s
    volumes:
      - storage:/var/www/html/storage
    secrets:
      - source: google_sheets_credentials
        target: /var/www/html/storage/google-sheets-credentials.json
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'artisan schedule:work' > /dev/null"]
      interval: 60s
      timeout: 5s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - backend

  migrate:
    <<: [*hardening, *php-writable]
    image: emms-app:${IMAGE_TAG:-latest}
    pull_policy: never
    restart: "no"
    command: ["php", "artisan", "migrate", "--force"]
    environment:
      SKIP_OPTIMIZE: "1"
    volumes:
      - storage:/var/www/html/storage
    networks:
      - backend

  web:
    <<: *hardening
    build:
      context: .
      target: web
      args:
        PHP_VERSION: ${PHP_VERSION:-8.3.36}
    image: emms-web:${IMAGE_TAG:-latest}
    # Only the port numbers below 1024 need this one capability; everything else is dropped.
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS in the environment file}
      TLS_MODE: ${TLS_MODE:-acme}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      # Certificates and Caddy's state survive restarts (otherwise a new certificate is requested every time).
      - caddy_data:/data
      - caddy_config:/config
      # Uploaded files that are meant to be public, read-only.
      - type: volume
        source: storage
        target: /var/www/html/public/storage
        read_only: true
        volume:
          subpath: app/public
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8081/up"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      app:
        condition: service_healthy
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  storage:
  caddy_data:
  caddy_config:

secrets:
  # The Google service account used for the Sheets / Gmail syncs. Kept out of the image and out of git.
  google_sheets_credentials:
    file: ${GOOGLE_CREDENTIALS_FILE:-./secrets/google-sheets-credentials.json}
