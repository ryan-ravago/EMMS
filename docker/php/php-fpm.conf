; PHP-FPM for the EMMS container. Runs as the non-root user the image switches to (www-data),
; so no user/group lines. Port 9000 is only reachable from the Caddy container on the private network.

[global]
error_log = /proc/self/fd/2
daemonize = no
log_level = warning
emergency_restart_threshold = 10
emergency_restart_interval = 1m
process_control_timeout = 10s

[www]
listen = 9000
; Dynamic pool sized for a small internal app. A worker normally uses 30-60 MB (256 MB at most), so keep
; max_children x that figure under the container memory limit set in compose.
pm = dynamic
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
; Recycle workers so a leak can never grow without bound.
pm.max_requests = 500
request_terminate_timeout = 65s

; Health check (see HEALTHCHECK in the Dockerfile).
ping.path = /ping
ping.response = pong

; Compose passes the settings as environment variables; Laravel reads them from there.
clear_env = no
catch_workers_output = yes
decorate_workers_output = no

; The web process never needs to run programs. (The CLI, used by the queue worker and scheduler, is not affected.)
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,show_source,highlight_file,phpinfo
php_admin_flag[log_errors] = on
