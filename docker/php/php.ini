; PHP settings for the EMS container (production-hardened; the same file is used for testing).

; --- Safety ----------------------------------------------------------------
expose_php = Off
display_errors = Off
display_startup_errors = Off
html_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
allow_url_include = Off
allow_url_fopen = On
cgi.fix_pathinfo = 0
session.cookie_httponly = 1
session.cookie_secure = 1
session.use_strict_mode = 1
session.cookie_samesite = Lax

; --- Limits ----------------------------------------------------------------
memory_limit = 256M
max_execution_time = 60
max_input_time = 60
max_input_vars = 3000
post_max_size = 25M
upload_max_filesize = 20M
max_file_uploads = 20
upload_tmp_dir = /tmp
sys_temp_dir = /tmp

; --- Locale ----------------------------------------------------------------
date.timezone = Asia/Manila
default_charset = UTF-8
zend.assertions = -1

; --- Performance -----------------------------------------------------------
realpath_cache_size = 4096K
realpath_cache_ttl = 600
zend.enable_gc = 1

; --- OPcache ---------------------------------------------------------------
; The code in the image never changes while it runs, so files are never re-checked
; (a new image = a new container = a fresh cache).
opcache.enable = 1
; The queue worker and scheduler are long-running CLI processes: they load each class once, so the shared cache gains nothing there.
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 30000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
opcache.save_comments = 1
opcache.enable_file_override = 1
opcache.huge_code_pages = 0
; JIT stays off: no measurable gain for a database-bound web app, and one less moving part.
opcache.jit = disable
opcache.jit_buffer_size = 0
